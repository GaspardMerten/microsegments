<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__DESC__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>__LEAFLETCSS__</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
__CSS__</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><pattern id="mshatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#18213a"/><rect width="2.4" height="6" fill="#5d6a88"/></pattern><pattern id="mszone" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="2.4" height="6" fill="#0b1224" fill-opacity=".5"/></pattern></defs></svg>
<header class="wrap">
  <div class="top"><h1 id="h1"></h1><div class="seg" id="langs" role="group" aria-label="Language"></div></div>
  <p class="per" id="per"></p>
  <div class="tiles" id="tiles"></div>
</header>
<main class="wrap">
  <div class="controls">
    <div class="clock" id="clock"></div>
    <button id="play" type="button" aria-pressed="false"></button>
    <div class="slider">
      <div class="dual" id="dual"><div class="trk"></div><div class="sel" id="hsel"></div><input type="range" id="hA" step="1"><input type="range" id="hB" step="1"></div>
      <div class="ticks" id="hticks"></div>
    </div>
    <div class="row2">
      <span class="grp"><label id="l_views"></label><div class="seg" id="views"></div></span>
      <span class="grp" id="g_mode" hidden><label id="l_mode"></label><div class="seg" id="modes"></div></span>
      <span class="grp" id="g_days"><label id="l_days"></label><div class="seg" id="days"></div></span>
      <span class="grp"><label id="l_dir"></label><div class="seg" id="dirs"></div></span>
      <span class="grp" id="g_ver" hidden><label id="l_ver"></label><div class="seg" id="vers"></div></span>
      <span class="grp"><label id="l_bands"></label><div class="seg" id="bands"></div></span>
      <span class="grp"><label id="l_metric"></label><div class="seg" id="metric"></div></span>
      <span class="grp" id="g_stops"><label id="l_stops"></label><div class="seg" id="stopsT"></div><span id="stopsQ"></span></span>
    </div>
  </div>
  <div class="grid">
    <div class="mapcol"><div class="panel">
      <div id="map" role="img"></div>
      <div class="legend" id="legend"></div>
    </div></div>
    <div class="panel side">
      <h2 id="hstitle"></h2>
      <p class="note" id="hsnote"></p>
      <div id="hslist"></div>
    </div>
  </div>
  <section class="card" id="mxcard">
    <div class="mxhead"><h2 id="mxtitle"></h2><span class="grp"><div class="seg" id="mxdirs"></div><button id="mxfull" class="btn" type="button" aria-pressed="false"></button></span></div>
    <p class="sub" id="mxsub"></p>
    <div class="legend mxleg" id="mxlegend"></div>
    <div class="svgwrap mxwrap" id="mxwrap"><svg id="mxh" aria-hidden="true"></svg><svg id="mx" role="img"></svg></div>
  </section>
  <section class="card">
    <h2 id="proftitle"></h2>
    <p class="sub" id="profsub"></p>
    <div class="svgwrap"><svg id="prof" width="100%" height="300" role="img"></svg></div>
  </section>
  <section class="card">
    <h2 id="covtitle"></h2>
    <p class="sub" id="covsub"></p>
    <div class="cal"><div class="calwrap"><svg id="cal" role="img"></svg></div><div class="calleg" id="calleg"></div></div>
  </section>
  <section class="card method">
    <h2 id="mtitle"></h2>
    <ul id="method"></ul>
  </section>
</main>
<footer class="wrap" id="footer"></footer>
<div id="tip" role="tooltip"></div>
<div id="pop" role="tooltip" hidden></div>
<script id="ms-data" type="application/json">__DATA__</script>
<script>
__JS__</script>
</body>
</html>
