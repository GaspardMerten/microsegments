<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__DESC__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>__LEAFLETCSS__</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* microsegments report: one line, map + hotspots + hour x microsegment matrix share one state
   (direction, version, weekdays, hour or band, metric, stop zones). */
:root{
  color-scheme: dark;
  --paper:#091124; --surface:#101a30; --surface-2:#16223d; --line:#24324f;
  --ink:#eef1f6; --ink-2:#b4bdd0; --ink-3:#7f8aa3; --acc:#F3C300; --hot:#ffe600;
  --null:#3a4560; --masked:#26324d; --deep:#0b1224;
  --serif:"Fraunces", Georgia, serif; --sans:"Archivo", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans)}
a{color:var(--acc)}
.wrap{max-width:1180px;margin:0 auto;padding-left:24px;padding-right:24px}
header{padding-top:40px;padding-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kicker{font:500 12px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
h1{font:800 clamp(32px,5vw,56px)/1.04 var(--serif);letter-spacing:-.02em;margin:14px 0 16px;max-width:24ch;hyphens:manual}
h1 .badge{display:inline-block;background:var(--acc);color:#111;font:700 .62em/1 var(--sans);padding:.14em .32em;border-radius:.18em;vertical-align:.12em;margin-right:.22em}
h2{font:700 24px/1.2 var(--serif);margin:0 0 6px}
p.lede{font-size:clamp(17px,1.6vw,19px);color:var(--ink-2);max-width:68ch;margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:28px}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--surface);padding:18px 18px 16px;min-width:0}
.tile b{display:block;font:700 clamp(24px,3vw,32px)/1 var(--serif);font-variant-numeric:tabular-nums}
.tile span{display:block;margin-top:8px;color:var(--ink-2);font-size:14px;line-height:1.4}
.controls{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;margin-top:24px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.clock{font:600 30px/1 var(--mono);min-width:110px;font-variant-numeric:tabular-nums}
.clock small{display:block;font:500 11px var(--mono);letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;margin-top:4px}
#play{font:inherit;min-width:120px;background:var(--acc);border:0;border-radius:10px;color:#111;font-weight:700;padding:9px 14px;cursor:pointer}
#play:focus-visible{outline:2px solid #fff;outline-offset:2px}
.slider{flex:1 1 240px;display:flex;flex-direction:column;gap:2px;min-width:0}
input[type=range]{width:100%;accent-color:var(--acc)}
.ticks{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--ink-3)}
.grp{display:inline-flex;align-items:center;gap:10px;flex-wrap:nowrap}
.grp[hidden]{display:none}
@media (max-width:600px){.grp{flex-wrap:wrap;gap:6px}.grp>label{flex-basis:100%}}
.row2{flex-basis:100%;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.controls label,.lbl{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--ink-2);padding:7px 11px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
.seg button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.seg button:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.grid>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#map{height:600px;background:var(--deep)}
#map .nomap{padding:24px;color:var(--ink-3)}
@media (min-width:900px){.mapcol{position:sticky;top:16px}}
.leaflet-container{background:var(--deep);font-family:var(--sans)}
.leaflet-control-attribution{background:rgba(9,17,36,.75)!important;color:var(--ink-3)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.leaflet-tooltip{background:#0f1830;color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.4);font:13px/1.45 var(--sans)}
.leaflet-tooltip-top:before,.leaflet-tooltip-bottom:before,.leaflet-tooltip-left:before,.leaflet-tooltip-right:before{display:none}
.lab{font:600 11px/1 var(--sans);color:var(--ink-2);white-space:nowrap;text-shadow:0 0 4px var(--deep),0 0 8px var(--deep);pointer-events:none}
.lab.u{transform:translate(-50%,-100%) translateY(-8px)}
.lab.r{transform:translate(9px,-50%)}
.lab.hide{display:none}
.hsm{width:22px;height:22px;border-radius:50%;background:var(--hot);color:#111;font:700 12px/22px var(--sans);text-align:center;box-shadow:0 0 0 2px var(--deep),0 1px 4px rgba(0,0,0,.6)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2);padding:10px 14px;border-top:1px solid var(--line)}
.legend .ramp{flex:1 1 260px;min-width:200px;max-width:420px}
.legend .ramp .bar{height:8px;border-radius:4px}
.legend .ramp .tk{position:relative;height:14px;font:10px var(--mono);color:var(--ink-3)}
.legend .ramp .tk span{position:absolute;transform:translateX(-50%);top:2px;white-space:nowrap}
.legend .ramp .tk span:first-child{transform:none}
.legend .ramp .tk span:last-child{transform:translateX(-100%)}
.legend .txt{flex:1 1 260px}
.sw{display:inline-block;width:14px;height:8px;border-radius:2px;vertical-align:middle;margin-right:5px}
.sw.hatch{background:repeating-linear-gradient(45deg,#5d6a88 0 2px,#18213a 2px 5px)}
/* short label + '*' that opens a plain-language explanation (hover, tap, Esc / outside click closes) */
.qm{font:700 13px/1 var(--sans);color:var(--acc);background:transparent;border:1px solid var(--line);border-radius:50%;width:20px;height:20px;padding:0;margin-left:4px;cursor:pointer;vertical-align:middle}
.qm:hover,.qm[aria-expanded=true]{border-color:var(--acc)}
.qm:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#pop{position:fixed;z-index:3100;max-width:min(340px,calc(100vw - 24px));background:#0f1830;color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.5);font:13px/1.5 var(--sans);padding:9px 12px}
body.nohs .grid{grid-template-columns:minmax(0,1fr)}
body.nohs .grid .side{display:none}
body.nohs #map{height:min(70vh,640px)}
.legend .hk{display:inline-block;width:16px;height:8px;border:2px solid var(--hot);border-radius:2px;vertical-align:middle;margin-right:5px}
.side{padding:16px 16px 10px}
.side .note{font-size:13px;color:var(--ink-3);margin:0 0 10px}
.hs{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 8px;border-radius:8px;cursor:pointer;border:0;background:transparent;color:inherit;font:inherit;text-align:left;width:100%}
.hs:hover,.hs.on{background:var(--surface-2)}
.hs:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.hs .nm{font-weight:600;font-size:14px;line-height:1.3}
.hs .nm .ar{color:var(--ink-3);font-weight:400}
.hs .meta{font:12px/1.4 var(--mono);color:var(--ink-3);margin-top:3px}
.hs .v{font:700 19px/1 var(--serif);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.hs .v small{display:block;font:500 11px var(--mono);color:var(--ink-3);margin-top:4px}
.hs .n{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--hot);color:#111;font:700 12px/22px var(--sans);text-align:center}
.empty{color:var(--ink-3);font-size:14px;padding:8px}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px}
.sub{color:var(--ink-3);font-size:13px;margin:0 0 12px;max-width:110ch}
.axis text{fill:var(--ink-3);font:11px var(--mono)}
.axis line{stroke:var(--line)}
.method{color:var(--ink-2);font-size:14px}
.method ul{max-width:84ch;padding-left:20px}
.method li{margin:6px 0}
footer{color:var(--ink-3);font-size:12px;padding:28px 0 48px}
.mxhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.mxleg{border-top:0;padding:0 0 10px}
#mxcard.full{position:fixed;inset:0;z-index:2000;margin:0;border-radius:0;overflow:auto;padding:16px 20px;background:var(--surface)}
#mxcard.full .sub{margin-bottom:6px}
body.mxopen{overflow:hidden}
.svgwrap{overflow:hidden}
svg{display:block}
#tip{position:fixed;z-index:3000;pointer-events:none;background:#0f1830;color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.4);font:13px/1.45 var(--sans);padding:6px 9px;max-width:320px;display:none}
.cal{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.cal svg text{fill:var(--ink-3);font:10px var(--mono)}
.cal .calleg{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.calwrap{overflow-x:auto;max-width:100%}
.vtag{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#c9b36a;border:1px solid #6b5d2e;border-radius:4px;padding:1px 5px;white-space:nowrap;margin-left:6px}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}#map,body.nohs #map{height:440px}.tiles{grid-template-columns:repeat(2,1fr)}.tiles.t3{grid-template-columns:repeat(2,1fr)}.tiles.t3 .tile:last-child{grid-column:1/-1}}
@media (max-width:600px){.wrap{padding-left:16px;padding-right:16px}header{padding-top:24px}.clock{font-size:24px;min-width:90px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><pattern id="mshatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#18213a"/><rect width="2.4" height="6" fill="#5d6a88"/></pattern></defs></svg>
<header class="wrap">
  <div class="top"><div class="kicker" id="kicker"></div><div class="seg" id="langs" role="group" aria-label="Language"></div></div>
  <h1 id="h1"></h1>
  <p class="lede" id="lede"></p>
  <div class="tiles" id="tiles"></div>
</header>
<main class="wrap">
  <div class="controls">
    <div class="clock" id="clock"></div>
    <button id="play" type="button" aria-pressed="false"></button>
    <div class="slider">
      <input type="range" id="hour" step="1">
      <div class="ticks" id="hticks"></div>
    </div>
    <div class="row2">
      <span class="grp" id="g_mode" hidden><label id="l_mode"></label><div class="seg" id="modes"></div></span>
      <span class="grp" id="g_days"><label id="l_days"></label><div class="seg" id="days"></div></span>
      <span class="grp"><label id="l_dir"></label><div class="seg" id="dirs"></div></span>
      <span class="grp" id="g_ver" hidden><label id="l_ver"></label><div class="seg" id="vers"></div></span>
      <span class="grp"><label id="l_bands"></label><div class="seg" id="bands"></div></span>
      <span class="grp"><label id="l_metric"></label><div class="seg" id="metric"></div></span>
      <span class="grp" id="g_unit"><label id="l_unit"></label><div class="seg" id="unit"></div></span>
      <span class="grp"><label id="l_stops"></label><div class="seg" id="stopsT"></div></span>
    </div>
  </div>
  <div class="grid">
    <div class="mapcol"><div class="panel">
      <div id="map" role="img"></div>
      <div class="legend" id="legend"></div>
    </div></div>
    <div class="panel side">
      <h2 id="hstitle"></h2>
      <p class="note" id="hsnote"></p>
      <div id="hslist"></div>
    </div>
  </div>
  <section class="card" id="mxcard">
    <div class="mxhead"><h2 id="mxtitle"></h2><span class="grp"><div class="seg" id="mxdirs"></div><button id="mxfull" class="btn" type="button" aria-pressed="false"></button></span></div>
    <p class="sub" id="mxsub"></p>
    <div class="legend mxleg" id="mxlegend"></div>
    <div class="svgwrap"><svg id="mx" width="100%" role="img"></svg></div>
  </section>
  <section class="card">
    <h2 id="proftitle"></h2>
    <p class="sub" id="profsub"></p>
    <div class="svgwrap"><svg id="prof" width="100%" height="300" role="img"></svg></div>
  </section>
  <section class="card">
    <h2 id="covtitle"></h2>
    <p class="sub" id="covsub"></p>
    <div class="cal"><div class="calwrap"><svg id="cal" role="img"></svg></div><div class="calleg" id="calleg"></div></div>
  </section>
  <section class="card method">
    <h2 id="mtitle"></h2>
    <ul id="method"></ul>
  </section>
</main>
<footer class="wrap" id="footer"></footer>
<div id="tip" role="tooltip"></div>
<div id="pop" role="tooltip" hidden></div>
<script id="ms-data" type="application/json">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('ms-data').textContent);
const P = D.params || {};
const TICK = P.tick_s || 20;
const REFH = P.reference_hours || [20, 23];
const HTH = P.hotspot_theta_s ?? 2;   // hotspot threshold, seconds per vehicle
const DAYH = D.day_hours || [6, 21];
const BANDDEF = D.bands || {am: [7, 10], pm: [16, 19], day: [6, 21], evening: [20, 23]};
const LOC = {fr: 'fr-BE', en: 'en-GB'};
const LINEH = [6, 23];   // window of the line-level reference

// ---------------------------------------------------------------- words (fr default, en)
const NOUN = {
  fr: {tram: ['tram', 'trams'], bus: ['bus', 'bus'], trolleybus: ['trolleybus', 'trolleybus'], metro: ['métro', 'métros'], rail: ['train', 'trains'], ferry: ['bateau', 'bateaux'], _: ['véhicule', 'véhicules']},
  en: {tram: ['tram', 'trams'], bus: ['bus', 'buses'], trolleybus: ['trolleybus', 'trolleybuses'], metro: ['metro train', 'metro trains'], rail: ['train', 'trains'], ferry: ['boat', 'boats'], _: ['vehicle', 'vehicles']},
};
const MODE = {fr: {tram: 'Tram', bus: 'Bus', trolleybus: 'Trolleybus', metro: 'Métro', rail: 'Train', ferry: 'Bateau', _: 'Ligne'},
              en: {tram: 'Tram', bus: 'Bus', trolleybus: 'Trolleybus', metro: 'Metro', rail: 'Train', ferry: 'Ferry', _: 'Line'}};
const T = {
  fr: {
    title: (m, l) => `Où les ${m} s'attardent-ils\u00a0?`,
    lede: (L, tk, m1, m) => `Toutes les ${tk} secondes, on note la position de chaque ${m1}. La ligne est découpée en tronçons d'environ ${L} m et on compte combien de fois un ${m1} y est vu : 1 observation ≈ ${tk} s passées là. Vert = ça roule, rouge = ça bloque. « Écart avec le soir » : le temps en plus par rapport à ${REFH[0]}–${REFH[1]} h, quand la circulation est fluide.`,
    days: 'Jours', dir: 'Sens', ver: 'Version du tracé', bands: 'Moyennes', metric: 'Mesure', unit: 'Par', stops: 'Arrêts',
    dow: ['Lu', 'Ma', 'Me', 'Je', 'Ve', 'Sa', 'Di'], dowl: ['lundis', 'mardis', 'mercredis', 'jeudis', 'vendredis', 'samedis', 'dimanches'],
    dowd: ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'],
    alldays: 'tous les jours retenus', weekdays: 'jours ouvrables',
    bandl: {am: 'Pointe du matin', pm: 'Pointe du soir', day: 'Journée', evening: 'Soirée'},
    metrics: {oph: 'Observations par heure', opp: 'Observations par passage', ex: 'Écart avec le soir', exl: 'Écart avec la ligne'},
    view: 'Vue', modes: {one: 'Une période', cmp: 'Comparer deux périodes'},
    cmetrics: {d: 'Temps par passage', dx: 'Écart avec le soir'},
    unitl: {seg: '30 m', m10: '10 m'},
    stopsl: {true: 'Inclus', false: 'Exclus'},
    stopsTitle: (a, b) => `Zone d'arrêt : de ${a} m avant à ${b} m après chaque arrêt`,
    towards: t => `vers ${t}`,
    play: '▶ Journée', pause: '❚❚ Pause', mean: 'moyenne',
    tiles: {
      days: (n, x) => `jours analysés${x ? ` ; ${x}` : ''}`,
      segs: (n, L) => `microsegments d'environ ${L} m, dans les deux sens`,
      obs: 'positions comptées sur la période',
      hs: (n) => D.hotspots_status === 'not_computed' ? 'points chauds : pas assez de jours pour les repérer' : n ? 'points chauds : des retards répétés d\'un jour à l\'autre' : 'aucun point chaud net sur la période',
    },
    hstitle: 'Points chauds', hsnote: (m1, tk) => `Tronçons où chaque ${m1} s'attarde nettement, jour après jour : plus qu'en soirée (${REFH[0]}–${REFH[1]} h) aux mêmes endroits, ou plus que sur le reste de la ligne à toute heure (un feu, un carrefour). La valeur : observations en plus par ${m1} sur tout le tronçon (≈ secondes perdues, à raison de ${tk} s par observation). Cliquez pour le voir sur la carte.`,
    hsnone: 'Aucun point chaud ne ressort dans ce sens : les écarts restent faibles ou varient trop d\'un jour à l\'autre.',
    hsstops: 'Dans ce sens, les points chauds sont aux arrêts : affichez les zones d\'arrêt pour les voir.',
    crit: {peak: 'comparé au soir', persistent: 'comparé au reste de la ligne', both: 'comparé au soir et au reste de la ligne'},
    hsalt: 'Les points chauds sont calculés sur la version principale du tracé.',
    hsnot: 'Points chauds non calculés : il faut au moins 5 jours pour juger si un retard se répète.',
    hsmore: n => `Voir les ${n} points chauds`, hsless: 'N\'afficher que les principaux',
    kind: {infrastructure: 'toute la journée', congestion: 'aux heures de pointe', mixed: 'mixte'},
    zone: {stop: 'à l\'arrêt', running: 'entre les arrêts'},
    perveh: m1 => `obs. par ${m1}`, ci: (a, b) => `IC 95 % : ${a} à ${b}`, daysPct: p => `${p} % des jours`, secs: s => `≈ ${s} s`,
    legend: {
      oph: (m, u) => `Observations par heure, pour ${u}`,
      opp: (m1, u) => `Secondes par ${m1}, pour ${u}`,
      ex: (m1, u) => `Écart avec le soir, s par ${m1} pour ${u}`,
      exl: (m1, u) => `Écart avec la ligne, s par ${m1} pour ${u}`,
      help: {
        oph: (m1, m) => `Toutes les ${TICK} s, on note où se trouve chaque ${m1}. Ici : combien de fois, en une heure, un ${m1} est vu sur ce bout de voie. Plus il y en a, plus les ${m} y passent de temps (1 observation ≈ ${TICK} s).`,
        opp: (m1, m) => `Toutes les ${TICK} s, on note où se trouve chaque ${m1}. Plus un bout de voie collecte d'observations, plus les ${m} y restent : vert = ça roule, rouge = ça bloque. 1 observation ≈ ${TICK} s.`,
        ex: (m1, m) => `Le temps que chaque ${m1} perd ici par rapport au soir (${REFH[0]}–${REFH[1]} h), quand la circulation est fluide. Vert : comme le soir ; rouge : nettement plus lent.`,
        exl: (m1, m) => `Le temps que chaque ${m1} perd ici par rapport à son allure habituelle sur la ligne, entre deux arrêts. Fait ressortir un feu ou un carrefour lent à toute heure, même le soir.`,
      },
      masked: 'zone d\'arrêt masquée', nodata: 'pas assez de données', hot: 'point chaud', evening: ' (le soir est la référence)',
      what: 'Explication',
    },
    tip: {
      after: (a, b, s) => `${a} à ${b} m après ${s}`, towards: t => `vers ${t}`,
      oph: v => `${v} observations par heure`, oph10: v => `${v} par heure pour 10 m`,
      opp: (v, s) => `${v} observations par passage (≈ ${s} s)`, ex: (v, s) => `${v} par rapport au soir (≈ ${s} s)`,
      same: 'comme le soir', stop: 'Zone d\'arrêt', nodata: 'pas assez de données', days: n => `${n} jours`, partial: 'tronçon absent certains jours',
      exl: (v, s) => `${v} par rapport à la ligne (≈ ${s} s)`, freq: (v, m) => `${v} ${m} par heure`,
    },

    mtitle: 'Method',
    method: (m, m1) => [
      `<b>Observations.</b> Every position fix (about every ${TICK} s) of a ${m1} on the line counts as one observation in the micro-segment it falls in. ${m[0].toUpperCase() + m.slice(1)} waiting at the terminus are not counted. Denser feeds (GTFS-RT) are thinned to one position per ${m1} every ${TICK} s.`,

  });
  drawHotMap();
  setTimeout(declutter, 0);
}
// Halos (hotspots, retained changes) are re-added on every render, and one SVG renderer draws in insertion order:
// push them under the coloured segments, then the dark casing under them, so the colours stay visible.
function haloUnder() { hotLayer.eachLayer(l => l.bringToBack && l.bringToBack()); baseLayer.eachLayer(l => l.bringToBack()); }
function hotSegIdx(E, h) { const out = []; E.seg.x0.forEach((x, i) => { if (x + E.seg.len[i] > h.x0_m + .5 && x < h.x1_m - .5) out.push(i); }); return out; }
function drawHotMap() {
  if (!map) return;
  const Lf = window.L, E = entry();
  hotLayer.clearLayers();
  if (!E || !isMain()) return;
  if (isCmp()) { cmpHotMap(); return haloUnder(); }
  for (const h of hotOfDir()) {
    const idx = hotSegIdx(E, h); if (!idx.length) continue;
    const on = st.hot === h.rank;
    idx.forEach(i => { const c = E.seg.c[i]; if (c.length > 1) Lf.polyline(c.map(([x, y]) => [y, x]), {renderer, color: '#ffe600', weight: on ? 18 : 15, opacity: on ? 1 : .8, lineCap: 'butt', interactive: false}).addTo(hotLayer); });
    const mid = E.seg.c[idx[Math.floor(idx.length / 2)]]; if (!mid || !mid.length) continue;
    const pt = mid[Math.floor(mid.length / 2)];
    Lf.marker([pt[1], pt[0]], {icon: Lf.divIcon({className: '', html: `<div class="hsm">${h.rank}</div>`, iconSize: [22, 22], iconAnchor: [30, 28]}), zIndexOffset: 1000})
      .on('click', () => selectHot(h.rank)).addTo(hotLayer);
  }
  haloUnder();
}
function recolor() {
  const cm = isCmp(), E = entry();
  if (!E) return;
  const v = cm ? cvals(E) : vals(E);
  segs.forEach((p, i) => p.setStyle({color: cm ? cColor(v[i]) : colorFor(v[i]), weight: shown(v[i]) ? 10 : 4}));
}

// ---------------------------------------------------------------- legend
// The same bar and tick positions for every measure; only the labels say which measure and unit.
function legend() {
  if (isCmp()) return cmpLegend();
  const l = tx().legend, m = st.metric, u = st.per10 ? '10 m' : '30 m', n = SC.TICKS.length;
  const bar = Array.from({length: 25}, (_, i) => timeColor(SC.T0 * (SC.T1 / SC.T0) ** (i / 24))).join(',');
  const lab = (T, i) => { const x = tickVal(T, m), d = Math.abs(x - Math.round(x)) < 1e-9 ? 0 : 1;
    return (i === n - 1 ? '≥ ' : i === 0 && !isEx(m) ? '≤ ' : '') + (isEx(m) && x ? '+' : '') + nf(x, d) + (m === 'oph' ? '' : ' s'); };
  const ticks = SC.TICKS.map((T, i) => `<span style="left:${tPos(T) * 100}%">${lab(T, i)}</span>`).join('');
  const txt = esc((m === 'oph' ? l.oph(noun(false), u) : m === 'opp' ? l.opp(noun(false), u) : m === 'exl' ? l.exl(noun(false), u)
    : l.ex(noun(false), u) + (st.band === 'evening' || (!st.band && st.hour >= REFH[0] && st.hour < REFH[1]) ? l.evening : ''))) + helpBtn(l.help[m](noun(false), noun(true)));
  $('legend').innerHTML = `<div class="ramp"><div class="bar" style="background:linear-gradient(90deg,${bar})"></div><div class="tk">${ticks}</div></div>` +
    `<span class="txt">${txt}</span><span><i class="sw" style="background:${NULLC}"></i>${l.nodata}</span>` +
    (st.stops ? '' : `<span><i class="sw hatch"></i>${l.masked}</span>`) +
    (hotOfDir().length && isMain() ? `<span><i class="hk"></i>${l.hot}</span>` : '');
  $('mxlegend').innerHTML = $('legend').innerHTML;
}

// ---------------------------------------------------------------- hotspots list
function drawHotList() {
  if (isCmp()) return cmpList();
  $('hstitle').textContent = tx().hstitle;
  const l = tx(), E = entry(), hs = hotOfDir();
  $('hsnote').textContent = l.hsnote(noun(false), nf(TICK, 0));
  if (!isMain()) { $('hslist').innerHTML = `<p class="empty">${l.hsalt}</p>`; return; }
  if (!hs.length) { $('hslist').innerHTML = `<p class="empty">${D.hotspots_status === 'not_computed' ? l.hsnot : hotDir().length ? l.hsstops : l.hsnone}</p>`; return; }
  $('hslist').innerHTML = hs.map((h, i) => {
    const v = h.excess_per_passage, lo = h.ci_lo, hi = h.ci_hi;
    const meta = [l.zone[h.zone] || h.zone, l.kind[h.kind] || h.kind, h.criterion ? l.crit[h.criterion] : '', h.criterion === 'persistent' ? '' : runsLabel((h.criterion === 'both' ? h.peak_hours : h.hours) || h.hours || [])].filter(Boolean).join(' · ');
    const ci = lo != null && hi != null ? l.ci(signed(lo * TICK, 0) + ' s', signed(hi * TICK, 0) + ' s') : '';
    const per = h.persistence != null ? l.daysPct(nf(h.persistence * 100, 0)) : '';
    return `<button type="button" class="hs${st.hot === h.rank ? ' on' : ''}" data-r="${h.rank}"><span class="n">${i + 1}</span>
      <div><div class="nm">${esc(h.from_stop_name)} <span class="ar">→</span> ${esc(h.to_stop_name)}</div>
      <div class="meta">${esc(meta)}</div><div class="meta">${[ci, per].filter(Boolean).join(' · ')}</div></div>
      <div class="v">${v == null ? '—' : signed(v, 1)}<small>${l.perveh(noun(false))}</small><small>${v == null ? '' : l.secs(signed(v * TICK, 0))}</small></div></button>`;
  }).join('');
  const n = hotAll().length;
  if (n > HOT_TOP) $('hslist').innerHTML += `<button type="button" class="btn" id="hsmore" style="margin:8px 0 4px">${st.hotAll ? l.hsless : l.hsmore(n)}</button>`;
  $('hslist').querySelectorAll('.hs').forEach(b => b.onclick = () => selectHot(+b.dataset.r));
  const mb = $('hsmore'); if (mb) mb.onclick = () => { st.hotAll = !st.hotAll; render(); };
}
function selectHot(r) {
  st.hot = st.hot === r ? null : r;
  const h = hotOfDir().find(x => x.rank === st.hot);
  if (h && h.peak_hour != null && h.peak_hour >= 0 && D.hours.includes(h.peak_hour)) { stop(); st.band = null; st.hour = h.peak_hour; }
  render();
  if (h && map) { const E = entry(), idx = hotSegIdx(E, h); const pts = idx.flatMap(i => E.seg.c[i].map(([x, y]) => [y, x])); if (pts.length) map.fitBounds(window.L.latLngBounds(pts), {maxZoom: 16, padding: [80, 80]}); }
}

// ---------------------------------------------------------------- matrix (hours x micro-segments)
let MX = null;
function drawMatrix() {
  const E = entry(), svg = $('mx'), l = tx();
  if (!E) { svg.innerHTML = ''; return; }
  const W = svg.clientWidth || 800, m = {l: 44, r: 8, t: 8, b: 90};
  const card = $('mxcard'), full = card.classList.contains('full');
  const RH = full ? Math.max(18, Math.floor((window.innerHeight - 220) / D.hours.length)) : 22;
  const cm = isCmp(), VALS = cm ? cvals : vals, COL = cm ? cColor : colorFor;
  const H = m.t + D.hours.length * RH + m.b, Ltot = E.stops.length ? E.stops[E.stops.length - 1].x : 1;
  const x = u => m.l + u / Ltot * (W - m.l - m.r);
  svg.setAttribute('height', H);
  let s = '';
  const rows = [];
  D.hours.forEach((h, r) => {
    const v = VALS(E, String(h)), y = m.t + r * RH; rows.push(v);
    s += `<rect class="mxrow" data-h="${h}" x="${m.l}" y="${y}" width="${W - m.l - m.r}" height="${RH}" fill="#0b1224"/>`;
    v.forEach(b => { s += `<rect x="${x(b.x0).toFixed(1)}" y="${y + .5}" width="${Math.max(.6, x(b.x0 + b.len) - x(b.x0) - .3).toFixed(1)}" height="${RH - 1}" fill="${COL(b)}" pointer-events="none"/>`; });
    s += `<text x="${m.l - 6}" y="${y + RH / 2 + 4}" text-anchor="end" fill="var(--ink-2)" font-size="12" font-family="var(--mono)">${h} h</text>`;
  });
  for (const t of E.stops) s += `<line x1="${x(t.x)}" x2="${x(t.x)}" y1="${m.t}" y2="${m.t + D.hours.length * RH}" stroke="#0b1224" stroke-width="1.5" pointer-events="none"/>`;
  // stop names, thinned so they do not overlap
  let last = -1e9;
  for (const t of E.stops) { const xx = x(t.x); if (xx - last < 13) continue; last = xx;
    s += `<text x="${xx}" y="${H - m.b + 14}" transform="rotate(-40 ${xx} ${H - m.b + 14})" text-anchor="end" fill="var(--ink-2)" font-size="12" font-family="var(--sans)">${esc(t.name)}</text>`; }
  if (isMain()) for (const h of (cm ? chgDir() : hotOfDir())) for (const [a, b] of hourRuns(h.hours || [])) {
    const r0 = D.hours.indexOf(a), r1 = D.hours.indexOf(b - 1); if (r0 < 0 || r1 < 0) continue;
    const on = cm ? st.chg === h.rank : st.hot === h.rank;
    s += `<rect x="${x(h.x0_m) - 1}" y="${m.t + r0 * RH}" width="${Math.max(3, x(h.x1_m) - x(h.x0_m) + 2)}" height="${(r1 - r0 + 1) * RH}" fill="none" stroke="#ffe600" stroke-opacity="${on ? 1 : .8}" stroke-width="${on ? 2.5 : 1.25}" pointer-events="none"/>`;
  }
  if (!st.band && D.hours.includes(st.hour)) s += `<rect x="${m.l - 1}" y="${m.t + D.hours.indexOf(st.hour) * RH}" width="${W - m.l - m.r + 2}" height="${RH}" fill="none" stroke="#b4bdd0" stroke-width="1.5" pointer-events="none"/>`;
  else if (st.band) { const hs = D.hours.filter(h => h >= BANDDEF[st.band][0] && h < BANDDEF[st.band][1]); if (hs.length) s += `<rect x="${m.l - 1}" y="${m.t + D.hours.indexOf(hs[0]) * RH}" width="${W - m.l - m.r + 2}" height="${hs.length * RH}" fill="none" stroke="#b4bdd0" stroke-width="1.5" stroke-dasharray="4 3" pointer-events="none"/>`; }
  svg.innerHTML = s;
  MX = {E, rows, m, RH, W, Ltot, tip: cm ? cTipHtml : tipHtml};
  const what = l.metrics[st.metric].toLowerCase() + (st.per10 ? ' (10 m)' : ' (30 m)');
  setSub($('mxsub'), cm ? ctx().mxsub(E.from, E.to, perLabel(CMP.a), perLabel(CMP.b), noun(false), st.stops) : l.mxsub(E.from, E.to, daysLabel(), what, st.stops, hsOn() && hotOfDir().length > 0));
}
$('mx').addEventListener('mousemove', e => {
  if (!MX) return;
  const r = $('mx').getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top, {m, RH, W, Ltot, E, rows} = MX;
  const row = Math.floor((py - m.t) / RH), u = (px - m.l) / (W - m.l - m.r) * Ltot;
  if (row < 0 || row >= rows.length || u < 0 || u > Ltot) return hideTip();
  const v = rows[row]; let i = v.findIndex(b => u >= b.x0 && u < b.x0 + b.len); if (i < 0) i = v.length - 1;
  showTip(e, `<span style="font-family:var(--mono)">${D.hours[row]} h</span> · ` + MX.tip(E, v[i]));
});
$('mx').addEventListener('mouseleave', hideTip);
$('mx').addEventListener('click', e => { const g = e.target.closest('.mxrow'); if (g) { stop(); st.band = null; st.hour = +g.dataset.h; render(); } });

// ---------------------------------------------------------------- profile along the line
function drawProfile() {
  const E = entry(), svg = $('prof'), l = tx();
  if (!E) { svg.innerHTML = ''; return; }
  if (isCmp()) return cmpProfile();
  const W = svg.clientWidth || 800, H = 300, m = {l: 48, r: 12, t: 18, b: 74};
  const Ltot = E.stops.length ? E.stops[E.stops.length - 1].x : 1, v = vals(E);
  const evening = st.band !== 'evening' && st.metric !== 'ex' ? vals(E, 'evening') : null;
  // fixed height: the top of the colour scale in the shown unit, whatever the line, hour or days
  const YM = tickVal(SC.T1), pv = b => { const u = metricVal(b); return u == null ? null : u / UDIV(); };
  const x = u => m.l + u / Ltot * (W - m.l - m.r), y = u => m.t + (1 - Math.min(Math.max(u, 0), YM) / YM) * (H - m.t - m.b);
  let s = '<g class="axis">';
  const e10 = Math.pow(10, Math.floor(Math.log10(YM / 5))), step = [1, 2, 2.5, 5, 10].map(f => f * e10).find(v => YM / v <= 6);
  for (let k = 0; k <= YM + 1e-9; k += step)
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(k)}" y2="${y(k)}" stroke-dasharray="${k ? '2 4' : ''}"/><text x="${m.l - 6}" y="${y(k) + 4}" text-anchor="end">${k ? nf(k, k < 1 || k % 1 ? 1 : 0) : '0'}</text>`;
  s += '</g>';
  let last = -1e9;
  for (const t of E.stops) {
    const xx = x(t.x);
    s += `<line x1="${xx}" x2="${xx}" y1="${m.t}" y2="${H - m.b}" stroke="#eef1f6" stroke-opacity=".15"/>`;
    if (xx - last >= 13) { last = xx; s += `<text x="${xx}" y="${H - m.b + 14}" transform="rotate(-40 ${xx} ${H - m.b + 14})" text-anchor="end" fill="var(--ink-3)" font-size="10" font-family="var(--sans)">${esc(t.name)}</text>`; }
  }
  v.forEach(b => { if (!shown(b)) s += maskBar(x, b, m, H); });
  v.forEach(b => { const u = pv(b); if (u != null && shown(b)) s += `<rect x="${x(b.x0).toFixed(1)}" y="${y(u).toFixed(1)}" width="${Math.max(1, x(b.x0 + b.len) - x(b.x0) - .5).toFixed(1)}" height="${(y(0) - y(u)).toFixed(1)}" fill="${colorFor(b)}"/>`; });
  if (evening) { let pth = ''; evening.forEach(b => { const u = pv(b); if (u != null && shown(b)) pth += `M${x(b.x0).toFixed(1)},${y(u).toFixed(1)}H${x(b.x0 + b.len).toFixed(1)}`; });
    s += `<path d="${pth}" stroke="#eef1f6" stroke-width="1.5" fill="none" opacity=".7"/>`; }
  s += freqLine(v.map(b => b.pph), v, x, H, m, W);
  s += `<text x="${m.l}" y="${m.t - 6}" fill="var(--ink-3)" font-size="11" font-family="var(--mono)">${esc(l.metrics[st.metric].toLowerCase())} (${st.metric === 'oph' ? '' : 's, '}${st.per10 ? '10 m' : '30 m'})</text>`;
  svg.innerHTML = s;
  svg.onmousemove = e => { const r = svg.getBoundingClientRect(), u = (e.clientX - r.left - m.l) / (W - m.l - m.r) * Ltot; if (u < 0 || u > Ltot) return hideTip();
    let i = v.findIndex(b => u >= b.x0 && u < b.x0 + b.len); if (i < 0) i = v.length - 1; showTip(e, tipHtml(E, v[i])); };
  svg.onmouseleave = hideTip;
  setSub($('profsub'), l.profsub(E.from, E.to, whenLabel(), !!evening, noun(true)));
}

// ---------------------------------------------------------------- coverage calendar
function drawCalendar() {
  const l = tx(), cv = D.coverage || {dates: [], c: [], inc: []}, svg = $('cal');
  const dates = cv.dates || [];
  if (!dates.length) { svg.innerHTML = ''; $('covsub').textContent = ''; return; }
  const exc = Object.fromEntries((D.period.excluded || []).map(e => [e.date, e.reason]));
  const xlab = Object.fromEntries((D.period.excluded || []).filter(e => e.label).map(e => [e.date, e.label]));
  const dayIdx = D.hours.map((h, j) => [h, j]).filter(([h]) => h >= DAYH[0] && h < DAYH[1]).map(([, j]) => j);
  const t0 = new Date(dates[0] + 'T12:00:00Z'), dow0 = (t0.getUTCDay() + 6) % 7;
  const C = 15, G = 3, top = 16, left = 26;
  const weekOf = s => Math.floor(((new Date(s + 'T12:00:00Z') - t0) / 864e5 + dow0) / 7);
  const nW = weekOf(dates[dates.length - 1]) + 1;
  let s = '';
  for (let w = 0; w < 7; w += 2) s += `<text x="0" y="${top + w * (C + G) + C - 3}">${l.dow[w]}</text>`;
  let lastMonth = -1;
  dates.forEach((d, k) => {
    const dt = new Date(d + 'T12:00:00Z'), w = (dt.getUTCDay() + 6) % 7, col = weekOf(d);
    if (dt.getUTCMonth() !== lastMonth && w <= 3) { lastMonth = dt.getUTCMonth(); s += `<text x="${left + col * (C + G)}" y="10">${dt.toLocaleDateString(LOC[st.lang], {month: 'short', timeZone: 'UTC'})}</text>`; }
    const row = (cv.c || [])[k] || [], vs = dayIdx.map(j => row[j]).filter(v => v != null);
    const mc = vs.length ? vs.reduce((a, b) => a + b, 0) / dayIdx.length : null;
    const inc = cv.inc ? cv.inc[k] : (exc[d] ? exc[d] : true);
    const selected = st.days.includes(w) || !PRESENT.includes(w) && inc !== true;
    let fill, status;
    if (inc === true) { fill = st.days.includes(w) ? colorOf(14 + 8 * (mc == null ? 1 : mc)) : '#24324f'; status = st.days.includes(w) ? l.cal.inc : l.cal.off; }
    else if (inc === 'not_selected') { fill = '#16223d'; status = l.cal.off; }
    else { fill = inc === 'no_data' ? '#3a4560' : '#c2414b'; status = `${l.cal.exc} : ${l.reasons[inc] || inc}${xlab[d] ? ` (${xlab[d]})` : ''}`; }
    const tip = `<b>${esc(fmtDate(d, {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'}))}</b><br>${esc(status)}${mc != null ? '<br>' + esc(l.covday(nf(mc * 100, 0))) : ''}`;
    s += `<rect x="${left + col * (C + G)}" y="${top + w * (C + G)}" width="${C}" height="${C}" rx="3" fill="${fill}" data-tip="${esc(tip)}" opacity="${selected ? 1 : .55}"/>`;
  });
  svg.setAttribute('width', left + nW * (C + G)); svg.setAttribute('height', top + 7 * (C + G));
  svg.innerHTML = s;
  svg.querySelectorAll('rect').forEach(r => { r.onmousemove = e => showTip(e, r.dataset.tip); r.onmouseleave = hideTip; });
  setSub($('covsub'), l.covsub(D.period.days, exclSummary(D.period.excluded)));
  $('calleg').innerHTML = [[colorOf(22), l.cal.inc], ['#c2414b', l.cal.exc], ['#24324f', l.cal.off], ['#3a4560', l.cal.none]]
    .map(([c, t]) => `<span><i class="sw" style="background:${c};width:12px;height:12px"></i>${esc(t)}</span>`).join('');
}

// ---------------------------------------------------------------- render
function pressed(el, f) { el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', f(b.dataset.k))); }
function render() {
  pressed($('langs'), k => k === st.lang);
  pressed($('days'), k => st.days.includes(+k));
  pressed($('dirs'), k => +k === st.dir); pressed($('mxdirs'), k => +k === st.dir);
  pressed($('bands'), k => k === st.band);
  pressed($('metric'), k => k === (isCmp() ? st.cmetric : st.metric));
  if (CMP) pressed($('modes'), k => k === st.mode);
  $('g_days').hidden = isCmp();
  pressed($('unit'), k => (k === 'm10') === st.per10);
  $('g_unit').hidden = isCmp();
  pressed($('stopsT'), k => k === String(st.stops));
  const d = dirOf(); if (!$('g_ver').hidden && d) pressed($('vers'), k => k === (st.ver || d.pattern_uid));
  const dl = isCmp() ? ctx().days : daysLabel();
  $('clock').innerHTML = st.band ? `${BANDDEF[st.band][0]}–${BANDDEF[st.band][1]} h<small>${tx().mean}, ${esc(dl)}</small>` : `${String(st.hour).padStart(2, '0')}:00<small>${esc(dl)}</small>`;
  hourEl.value = st.hour;
  const nohs = !hsOn();
  if (document.body.classList.contains('nohs') !== nohs) { document.body.classList.toggle('nohs', nohs); if (map) setTimeout(() => map.invalidateSize(), 0); }
  if (popBtn) closePop();
  recolor(); legend(); drawHotMap(); drawHotList(); drawMatrix(); drawProfile(); drawCalendar();
}
function drawAll() { buildVersions(); drawMap(); render(); }
let timer = null;
function stop() { clearInterval(timer); timer = null; const b = $('play'); b.textContent = tx().play; b.setAttribute('aria-pressed', 'false'); }
hourEl.addEventListener('input', e => { stop(); st.band = null; st.hour = +e.target.value; render(); });
$('play').addEventListener('click', () => {
  if (timer) return stop();
  const b = $('play'); b.textContent = tx().pause; b.setAttribute('aria-pressed', 'true');
  const H0 = D.hours[0], H1 = D.hours[D.hours.length - 1];
  if (st.band || st.hour >= H1) st.hour = H0;
  st.band = null; render();
  timer = setInterval(() => { st.hour = st.hour >= H1 ? H0 : st.hour + 1; render(); }, 900);
});
window.addEventListener('resize', () => { if (map) map.invalidateSize(); drawProfile(); drawMatrix(); });
// Full screen: the card becomes a fixed overlay (works everywhere), plus the browser's full screen when available.
const mxCard = $('mxcard'), mxBtn = $('mxfull');
function setFull(on) {
  mxCard.classList.toggle('full', on); document.body.classList.toggle('mxopen', on);
  mxBtn.textContent = on ? tx().unfull : tx().full; mxBtn.setAttribute('aria-pressed', on);
  if (on && mxCard.requestFullscreen) mxCard.requestFullscreen().catch(() => {});
  if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  requestAnimationFrame(drawMatrix);
}
mxBtn.onclick = () => setFull(!mxCard.classList.contains('full'));
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && mxCard.classList.contains('full')) setFull(false); else drawMatrix(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && mxCard.classList.contains('full')) setFull(false); });

buildControls(); texts(); tiles(); initMap(); drawAll();
document.querySelector('section.method').hidden = !METHOD;
// embedded: tell the host the directions, follow its direction control
if (window.parent !== window) {
  try { parent.postMessage({ms: 'dirs', dir: st.dir, dirs: DIRS.map(d => ({dir: d.dir, from: d.from, to: d.to}))}, '*'); } catch (x) {}
  window.addEventListener('message', e => {
    const m = e.data || {};
    if (m.ms === 'dir' && SETDIR && DIRS.some(d => d.dir === +m.dir) && +m.dir !== st.dir) SETDIR(m.dir);
  });
}
